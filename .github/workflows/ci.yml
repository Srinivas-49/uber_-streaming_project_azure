name: Databricks code quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python files
        run: python -m compileall -q uber_event_streaming
      - name: Run PySpark unit tests
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_PYTHON: python
        run: python -m unittest discover -s tests -v
      - name: Run complete pytest suite including TLC source checks
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_PYTHON: python
        run: python -m pytest -q tests
      - name: Run synthetic CDC replay demonstration
        env:
          PYTHONPATH: .
        run: python -m scripts.run_replay_demo --rides 30 > replay-evidence.json
      - name: Preserve CDC replay metrics
        uses: actions/upload-artifact@v4
        with:
          name: uber-synthetic-replay-evidence
          path: replay-evidence.json
          retention-days: 7
