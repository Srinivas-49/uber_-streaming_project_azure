# Declarative Automation Bundle (formerly Databricks Asset Bundle).
# Deployment requires an authenticated Azure Databricks workspace, a real Unity Catalog
# catalog, Event Hubs access, and repository code preflight fixes described in docs.
bundle:
  name: uber-azure-lakeflow

variables:
  catalog_name:
    description: Existing Unity Catalog catalog for the Uber project
  alert_email:
    description: Real email recipient for job and pipeline failure alerts

resources:
  pipelines:
    uber_lakeflow:
      name: uber-lakeflow-${bundle.target}
      catalog: ${var.catalog_name}
      schema: bronze
      channel: CURRENT
      continuous: false
      serverless: true
      libraries:
        - file:
            path: ./uber_event_streaming/transformations/ingest.py
        - file:
            path: ./uber_event_streaming/transformations/sliver.py
        - file:
            path: ./uber_event_streaming/transformations/silver_obt.sql
        - file:
            path: ./uber_event_streaming/transformations/model.py
      notifications:
        - alerts:
            - on-update-failure
            - on-flow-failure
          email_recipients:
            - ${var.alert_email}

  jobs:
    uber_daily_refresh:
      name: uber-lakeflow-refresh-${bundle.target}
      max_concurrent_runs: 1
      timeout_seconds: 7200
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: Europe/London
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${var.alert_email}
      tasks:
        - task_key: refresh_lakeflow
          pipeline_task:
            pipeline_id: ${resources.pipelines.uber_lakeflow.id}

targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production
